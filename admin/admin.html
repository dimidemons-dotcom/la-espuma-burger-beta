<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Espuma Burger - Panel Admin</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-dark: #050505;
  --bg-card: #0b0b0f;
  --bg-card-hover: #121216;
  --bg-input: #1a1a20;
  --bg-input-hover: #22222a;
  --gold: #e5bb46;
  --gold-light: #f0c94f;
  --gold-dark: #c9a038;
  --gold-gradient: linear-gradient(135deg, #e5bb46 0%, #f0c94f 50%, #e5bb46 100%);
  --text-primary: #f8e7ad;
  --text-secondary: rgba(248, 231, 173, 0.8);
  --text-muted: rgba(248, 231, 173, 0.6);
  --danger: #e74c3c;
  --danger-dark: #c0392b;
  --success: #27ae60;
  --success-dark: #1e8449;
  --warning: #f39c12;
  --border: rgba(229, 187, 70, 0.15);
  --border-light: rgba(229, 187, 70, 0.25);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.7);
  --shadow-gold: 0 4px 24px rgba(229, 187, 70, 0.25);
  --shadow-gold-strong: 0 8px 32px rgba(229, 187, 70, 0.35);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: 
    radial-gradient(circle at 80% 0%, rgba(93, 37, 150, 0.16), transparent 26%),
    radial-gradient(circle at 50% 0%, rgba(229, 187, 70, 0.12), transparent 24%),
    linear-gradient(180deg, #050505, #09090d 40%, #050505);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
}

.screen {
  min-height: 100vh;
}

.hidden {
  display: none !important;
}

/* Login Screen */
.login-container {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: 
    radial-gradient(circle at 80% 0%, rgba(93, 37, 150, 0.16), transparent 26%),
    radial-gradient(circle at 50% 0%, rgba(229, 187, 70, 0.12), transparent 24%),
    linear-gradient(180deg, #050505, #09090d 40%, #050505);
  position: relative;
  overflow: hidden;
}

.login-container::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
  animation: pulse 8s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 0.8; }
}

.login-box {
  background: var(--bg-card);
  padding: 3rem;
  border-radius: 24px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg), var(--shadow-gold-strong);
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
  backdrop-filter: blur(20px);
}

.login-title {
  font-family: 'Playfair Display', serif;
  font-size: 2.5rem;
  font-weight: 800;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
  text-align: center;
  letter-spacing: -0.02em;
}

.login-subtitle {
  color: var(--text-secondary);
  text-align: center;
  margin-bottom: 2.5rem;
  font-size: 0.95rem;
  font-weight: 400;
  letter-spacing: 0.02em;
}

/* Admin Dashboard */
.admin-header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 1.5rem 2.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}

.header-title {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 800;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}

.header-subtitle {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-left: 1rem;
  font-weight: 400;
}

.header-left {
  display: flex;
  align-items: center;
}

/* Stats Section */
.stats-section {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
  padding: 2.5rem;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 1.75rem;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gold-gradient);
  transform: scaleX(0);
  transition: transform 0.3s ease;
}

.stat-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  box-shadow: var(--shadow-md), var(--shadow-gold-strong);
}

.stat-card:hover::before {
  transform: scaleX(1);
}

.stat-icon {
  font-size: 2.5rem;
  filter: grayscale(0.3);
  transition: filter 0.3s;
}

.stat-card:hover .stat-icon {
  filter: grayscale(0);
}

.stat-value {
  font-size: 2.5rem;
  font-weight: 800;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: block;
  line-height: 1;
  margin-bottom: 0.25rem;
}

.stat-label {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Navigation */
.admin-nav {
  display: flex;
  gap: 0;
  padding: 0 2.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}

.nav-tab {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  padding: 1.25rem 2rem;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.3s ease;
  position: relative;
}

.nav-tab::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 0;
  height: 3px;
  background: var(--gold-gradient);
  transition: all 0.3s ease;
  transform: translateX(-50%);
}

.nav-tab:hover {
  color: var(--text-primary);
  background: var(--bg-card-hover);
}

.nav-tab.active {
  color: var(--gold);
}

.nav-tab.active::after {
  width: 100%;
}

/* Content Sections */
.content-section {
  padding: 2.5rem;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
}

.section-header h2 {
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

/* Filters */
.filters-bar {
  display: flex;
  gap: 1rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.search-input,
.filter-select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 0.875rem 1.25rem;
  border-radius: 12px;
  font-size: 0.9rem;
  min-width: 220px;
  transition: all 0.3s ease;
  font-weight: 400;
}

.search-input:focus,
.filter-select:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
  background: var(--bg-input-hover);
}

.search-input::placeholder {
  color: var(--text-muted);
}

/* Dishes Grid */
.dishes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.75rem;
}

.dish-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  backdrop-filter: blur(10px);
}

.dish-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  box-shadow: var(--shadow-lg), var(--shadow-gold-strong);
}

.dish-card.sold-out {
  opacity: 0.5;
  filter: grayscale(0.3);
}

.dish-image {
  width: 100%;
  height: 220px;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.dish-card:hover .dish-image {
  transform: scale(1.05);
}

.dish-image-placeholder {
  width: 100%;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-input);
  color: var(--text-muted);
  font-size: 0.9rem;
  font-weight: 500;
}

.dish-info {
  padding: 1.5rem;
}

.dish-name {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 0.5rem;
  letter-spacing: -0.01em;
}

.dish-description {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-bottom: 1rem;
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.dish-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.dish-price {
  font-size: 1.5rem;
  font-weight: 800;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.dish-category {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
  text-transform: capitalize;
  padding: 0.35rem 0.85rem;
  background: var(--bg-input);
  border-radius: 20px;
}

.dish-allergens {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.allergen-tag {
  background: var(--bg-input);
  color: var(--text-secondary);
  padding: 0.3rem 0.85rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: capitalize;
  border: 1px solid var(--border);
}

.sold-out-badge,
.featured-badge {
  display: inline-block;
  padding: 0.4rem 0.9rem;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-right: 0.5rem;
}

.sold-out-badge {
  background: var(--danger);
  color: white;
}

.featured-badge {
  background: var(--gold-gradient);
  color: var(--bg-dark);
}

.dish-actions {
  padding: 1.25rem 1.5rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  background: var(--bg-card-hover);
}

/* Buttons */
.btn {
  background: var(--gold-gradient);
  color: var(--bg-dark);
  border: none;
  padding: 0.875rem 1.75rem;
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  letter-spacing: 0.02em;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.btn:hover::before {
  width: 300px;
  height: 300px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-gold);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: var(--gold-gradient);
  color: var(--bg-dark);
}

.btn-secondary {
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border);
  font-weight: 600;
}

.btn-secondary:hover {
  background: var(--bg-input-hover);
  border-color: var(--gold-dark);
  box-shadow: var(--shadow-sm);
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-danger:hover {
  background: var(--danger-dark);
  box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
}

.btn-sm {
  padding: 0.6rem 1.25rem;
  font-size: 0.85rem;
}

/* Modal */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 2rem;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  max-width: 650px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.75rem 2rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card-hover);
}

.modal-header h2 {
  font-size: 1.5rem;
  font-weight: 700;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.close-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 2rem;
  cursor: pointer;
  line-height: 1;
  padding: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.close-btn:hover {
  background: var(--bg-input);
  color: var(--text-primary);
  transform: rotate(90deg);
}

.modal-content form {
  padding: 2rem;
}

/* Form Elements */
.form-group {
  margin-bottom: 1.75rem;
}

.form-row {
  display: flex;
  gap: 1.25rem;
  margin-bottom: 1.75rem;
}

.form-row .form-group {
  flex: 1;
}

label {
  display: block;
  margin-bottom: 0.6rem;
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

input[type="text"],
input[type="number"],
input[type="password"],
textarea,
select {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 0.875rem 1.25rem;
  border-radius: 12px;
  font-size: 0.9rem;
  font-family: inherit;
  transition: all 0.3s ease;
  font-weight: 400;
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
  background: var(--bg-input-hover);
}

textarea {
  resize: vertical;
  min-height: 100px;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  cursor: pointer;
  padding: 0.5rem;
  border-radius: 8px;
  transition: background 0.3s ease;
}

.checkbox-label:hover {
  background: var(--bg-input);
}

.checkbox-label input[type="checkbox"] {
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--gold);
}

.allergens-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 0.85rem;
}

.image-preview {
  margin-top: 1rem;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-input);
}

.image-preview img {
  max-width: 100%;
  max-height: 250px;
  object-fit: contain;
  display: block;
}

.form-actions {
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
  margin-top: 2.5rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
}

/* Orders */
.orders-list {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.order-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.75rem;
  transition: all 0.3s ease;
}

.order-card:hover {
  border-color: var(--gold-dark);
  box-shadow: var(--shadow-md);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
}

.order-id {
  font-weight: 700;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 1.1rem;
}

.order-date {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
}

.order-status {
  padding: 0.5rem 1rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.status-recibido {
  background: var(--gold-gradient);
  color: var(--bg-dark);
}

.status-preparando {
  background: #3498db;
  color: white;
}

.status-listo {
  background: var(--success);
  color: white;
}

.order-items {
  margin-bottom: 1.25rem;
}

.order-item {
  color: var(--text-secondary);
  font-size: 0.9rem;
  padding: 0.35rem 0;
  font-weight: 500;
}

.order-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
}

.order-total {
  font-weight: 800;
  font-size: 1.25rem;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.order-notes {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-style: italic;
  font-weight: 500;
}

.error-message {
  color: var(--danger);
  text-align: center;
  margin-top: 1rem;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 0.75rem;
  background: rgba(231, 76, 60, 0.1);
  border-radius: 8px;
  border: 1px solid rgba(231, 76, 60, 0.2);
}

/* Scrollbar Styling */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg-dark);
}

::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--gold-dark);
}

/* Responsive */
@media (max-width: 768px) {
  .admin-header {
    flex-direction: column;
    gap: 1rem;
    text-align: center;
    padding: 1.25rem 1.5rem;
  }

  .header-left {
    flex-direction: column;
  }

  .stats-section {
    grid-template-columns: repeat(2, 1fr);
    padding: 1.5rem;
  }

  .dishes-grid {
    grid-template-columns: 1fr;
  }

  .form-row {
    flex-direction: column;
  }

  .modal-content {
    max-height: 95vh;
    margin: 1rem;
  }

  .modal-content form {
    padding: 1.5rem;
  }

  .content-section {
    padding: 1.5rem;
  }

  .admin-nav {
    padding: 0 1.5rem;
  }

  .nav-tab {
    padding: 1rem 1.25rem;
    font-size: 0.85rem;
  }
}
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="login-container">
      <div class="login-box">
        <h1 class="login-title">La Espuma Burger</h1>
        <p class="login-subtitle">Panel de Administración</p>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" required placeholder="admin">
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
          <p id="login-error" class="error-message"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-dashboard" class="screen hidden">
    <header class="admin-header">
      <div class="header-left">
        <h1 class="header-title">La Espuma Burger</h1>
        <span class="header-subtitle">Panel de Administración</span>
      </div>
      <div class="header-right">
        <button id="logout-btn" class="btn btn-secondary">Cerrar Sesión</button>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-icon">🍔</div>
        <div class="stat-info">
          <span class="stat-value" id="total-dishes">0</span>
          <span class="stat-label">Total Platos</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-info">
          <span class="stat-value" id="available-dishes">0</span>
          <span class="stat-label">Disponibles</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">❌</div>
        <div class="stat-info">
          <span class="stat-value" id="soldout-dishes">0</span>
          <span class="stat-label">Agotados</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-info">
          <span class="stat-value" id="total-orders">0</span>
          <span class="stat-label">Pedidos</span>
        </div>
      </div>
    </section>

    <!-- Navigation Tabs -->
    <nav class="admin-nav">
      <button class="nav-tab active" data-tab="menu">Carta</button>
      <button class="nav-tab" data-tab="orders">Pedidos</button>
    </nav>

    <!-- Menu Management -->
    <section id="menu-section" class="content-section">
      <div class="section-header">
        <h2>Gestión de Carta</h2>
        <button id="new-dish-btn" class="btn btn-primary">Nuevo Plato</button>
      </div>

      <div class="filters-bar">
        <input type="text" id="search-input" placeholder="Buscar plato..." class="search-input">
        <select id="category-filter" class="filter-select">
          <option value="">Todas las categorías</option>
          <option value="picoteo">Picoteo</option>
          <option value="papas">Papas</option>
          <option value="enrollados">Enrollados</option>
          <option value="smash">Smash</option>
          <option value="platos">Platos</option>
          <option value="postres">Postres</option>
          <option value="bebidas">Bebidas</option>
        </select>
        <select id="availability-filter" class="filter-select">
          <option value="">Todos</option>
          <option value="available">Disponibles</option>
          <option value="soldout">Agotados</option>
        </select>
      </div>

      <div id="dishes-grid" class="dishes-grid"></div>
    </section>

    <!-- Orders Management -->
    <section id="orders-section" class="content-section hidden">
      <div class="section-header">
        <h2>Gestión de Pedidos</h2>
      </div>
      <div id="orders-list" class="orders-list"></div>
    </section>
  </div>

  <!-- Dish Modal -->
  <div id="dish-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Nuevo Plato</h2>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <form id="dish-form">
        <input type="hidden" id="dish-id">
        
        <div class="form-group">
          <label for="dish-name">Nombre *</label>
          <input type="text" id="dish-name" required>
        </div>

        <div class="form-group">
          <label for="dish-description">Descripción</label>
          <textarea id="dish-description" rows="3"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dish-price">Precio (€) *</label>
            <input type="number" id="dish-price" step="0.01" min="0" required>
          </div>
          <div class="form-group">
            <label for="dish-category">Categoría *</label>
            <select id="dish-category" required>
              <option value="">Seleccionar</option>
              <option value="picoteo">Picoteo</option>
              <option value="papas">Papas</option>
              <option value="enrollados">Enrollados</option>
              <option value="smash">Smash</option>
              <option value="platos">Platos</option>
              <option value="postres">Postres</option>
              <option value="bebidas">Bebidas</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="dish-image">Imagen</label>
          <input type="file" id="dish-image" accept="image/*">
          <div id="image-preview" class="image-preview"></div>
          <input type="hidden" id="dish-image-url">
        </div>

        <div class="form-group">
          <label>Alérgenos</label>
          <div class="allergens-grid">
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="gluten">
              <span>Gluten</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="lactosa">
              <span>Lactosa</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="huevo">
              <span>Huevo</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="frutos secos">
              <span>Frutos secos</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="soja">
              <span>Soja</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="pescado">
              <span>Pescado</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="marisco">
              <span>Marisco</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="mostaza">
              <span>Mostaza</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="sésamo">
              <span>Sésamo</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="sulfitos">
              <span>Sulfitos</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" name="allergen" value="apio">
              <span>Apio</span>
            </label>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="dish-available">
            <span>Disponible</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="dish-soldout">
            <span>Agotado</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="dish-featured">
            <span>Destacado</span>
          </label>
        </div>

        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
