<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>La Espuma Burger</title>
  <link rel="preload" as="image" href="/assets/inicio_burger_fachada.webp" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app">
    <section id="inicio" class="home-screen" aria-label="Inicio La Espuma Burger">
      <div class="home-overlay"></div>
      <div class="home-brand">
        <span class="home-kicker">La Espuma Burger</span>
        <h1>Carta viva</h1>
        <p>Smash, picoteo, papas y favoritos de la casa.</p>
        <button id="goMenuBtn" class="menu-cta" type="button">Menú</button>
      </div>
      <button id="homeAiBtn" class="home-ai" type="button" aria-label="Abrir Modo IA">Modo IA</button>
    </section>

    <section id="menu" class="menu-section" aria-label="Carta La Espuma Burger">
      <div class="menu-toolbar" id="menuToolbar">
        <div class="category-scroll" id="categoryBar" role="tablist" aria-label="Categorías de la carta"></div>
        <div class="view-row">
          <div class="view-dropdown" id="viewDropdown">
            <button class="view-trigger" id="viewTrigger" type="button" aria-haspopup="true" aria-expanded="false">Ver <span id="currentViewLabel">Grande</span></button>
            <div class="view-menu" id="viewMenu" role="menu" aria-label="Cambiar vista">
              <button type="button" class="view-option active" data-view="grande" role="menuitemradio" aria-checked="true">Grande</button>
              <button type="button" class="view-option" data-view="mosaico" role="menuitemradio" aria-checked="false">Mosaico</button>
            </div>
          </div>
        </div>
      </div>

      <div id="menuStatus" class="menu-status">Cargando carta...</div>
      <div id="menuContent" class="menu-content view-grande"></div>
    </section>
  </main>

  <button id="aiFloatingBtn" class="ai-floating" type="button" aria-label="Abrir Modo IA">Modo IA</button>

  <aside class="ai-panel" id="aiPanel" aria-hidden="true" aria-label="Modo IA La Espuma Burger">
    <div class="ai-card">
      <header class="ai-header">
        <div>
          <strong>Modo IA</strong>
          <span>Recomendaciones con la carta real</span>
        </div>
        <button id="aiCloseBtn" type="button" aria-label="Cerrar">×</button>
      </header>
      <div class="ai-messages" id="aiMessages"></div>
      <div class="ai-quick">
        <button type="button" data-question="Quiero una burger con bacon">Bacon</button>
        <button type="button" data-question="Recomiéndame algo con trufa">Trufa</button>
        <button type="button" data-question="Algo para compartir">Compartir</button>
        <button type="button" data-question="Algo sin carne">Vegetariano</button>
      </div>
      <form id="aiForm" class="ai-form">
        <input id="aiInput" type="text" placeholder="Dime qué te apetece..." autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </div>
  </aside>

  <template id="dishTemplate">
    <article class="dish-card">
      <div class="dish-image-wrap">
        <img class="dish-image" alt="" loading="lazy" />
        <span class="dish-price"></span>
        <span class="sold-badge">Agotado</span>
      </div>
      <div class="dish-info">
        <span class="dish-category"></span>
        <h3 class="dish-name"></h3>
        <p class="dish-desc"></p>
        <div class="dish-allergens"></div>
        <button class="dish-action" type="button">Añadir</button>
      </div>
    </article>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
