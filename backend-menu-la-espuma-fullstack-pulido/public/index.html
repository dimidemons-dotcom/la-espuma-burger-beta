<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>La Espuma Burger</title>
  <link rel="preload" as="image" href="/assets/inicio_burger_fachada.webp" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <section id="inicio" class="home-screen" aria-label="Inicio La Espuma Burger">
      <div class="home-bg" aria-hidden="true"></div>
      <div class="home-vignette" aria-hidden="true"></div>
      <div class="home-content">
        <img class="home-logo" src="/assets/hero_logo_black_bg.png" alt="La Espuma Burger" />
        <p class="home-kicker">Carta digital</p>
        <h1>Smash burgers<br/>con carácter</h1>
        <p class="home-copy">Menú actualizado, fotos, alérgenos y productos agotados al momento.</p>
        <button id="goMenu" class="home-menu-btn" type="button">Menú</button>
      </div>
    </section>

    <main id="menu" class="menu-section" aria-label="Carta La Espuma Burger">
      <div class="menu-sticky" id="menuSticky">
        <nav class="category-tabs" id="categoryTabs" aria-label="Categorías del menú"></nav>
        <div class="view-row">
          <div class="view-dropdown" id="viewDropdown">
            <button id="viewToggle" class="view-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span>Ver</span>
              <strong id="viewLabel">Grande</strong>
              <i aria-hidden="true">▾</i>
            </button>
            <div class="view-options" id="viewOptions" role="listbox" aria-label="Opciones de vista">
              <button class="view-option" data-view="grande" type="button" role="option">Grande</button>
              <button class="view-option" data-view="mosaico" type="button" role="option">Mosaico</button>
            </div>
          </div>
          <span id="apiStatus" class="api-status">Conectando carta…</span>
        </div>
      </div>
      <section id="menuGrid" class="menu-grid view-grande" aria-live="polite"></section>
    </main>
  </div>

  <button id="aiButton" class="ai-button" type="button" aria-label="Abrir Modo IA">
    <span></span> Modo IA
  </button>

  <aside id="aiPanel" class="ai-panel" aria-hidden="true">
    <div class="ai-card" role="dialog" aria-label="Modo IA del menú">
      <header>
        <div>
          <p>Modo IA</p>
          <h2>Te recomiendo algo de la carta</h2>
        </div>
        <button id="aiClose" class="ai-close" type="button" aria-label="Cerrar">×</button>
      </header>
      <div id="aiMessages" class="ai-messages"></div>
      <div class="quick-prompts" aria-label="Preguntas rápidas">
        <button data-question="Quiero una burger con bacon">Con bacon</button>
        <button data-question="Algo con trufa">Trufa</button>
        <button data-question="Algo vegetariano">Vegetariano</button>
        <button data-question="Algo para compartir">Para compartir</button>
      </div>
      <form id="aiForm" class="ai-form">
        <input id="aiInput" autocomplete="off" placeholder="Dime qué te apetece…" />
        <button type="submit">Enviar</button>
      </form>
    </div>
  </aside>

  <script src="/app.js" defer></script>
</body>
</html>
