<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · La Espuma Burger</title><link rel="stylesheet" href="/admin/admin.css"></head><body><div id="login" class="login"><div class="login-card"><img src="/assets/hero_wordmark.png" alt="La Espuma Burger"><h1>Panel de carta</h1><p>Gestiona platos, fotos, alérgenos y agotados.</p><input id="user" placeholder="Usuario" value="admin"><input id="pass" placeholder="Contraseña" type="password" value="espuma123"><button id="loginBtn">Entrar</button></div></div><main id="panel" class="panel hidden"><header><div><h1>La Espuma Burger</h1><p>Administración de carta</p></div><button id="newBtn">Nuevo plato</button></header><section class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="available">0</b><span>Disponibles</span></div><div><b id="soldout">0</b><span>Agotados</span></div></section><section class="toolbar"><input id="search" placeholder="Buscar plato"><select id="filter"><option value="">Todas</option><option>picoteo</option><option>papas</option><option>enrollados</option><option>smash</option><option>platos</option><option>postres</option><option>bebidas</option></select></section><section id="grid" class="grid"></section></main><dialog id="modal"><form method="dialog" id="form" class="form"><h2 id="modalTitle">Plato</h2><input type="hidden" id="id"><label>Nombre<input id="name" required></label><label>Descripción<textarea id="description"></textarea></label><label>Precio<input id="price" type="number" step="0.01"></label><label>Categoría<select id="category"><option>picoteo</option><option>papas</option><option>enrollados</option><option>smash</option><option>platos</option><option>postres</option><option>bebidas</option></select></label><label>Imagen<input id="image" placeholder="/assets/menu_bacon_burger.webp"></label><label>Subir foto<input id="file" type="file" accept="image/*"></label><img id="preview" class="preview"><label>Alérgenos<input id="allergens" placeholder="gluten, lactosa"></label><div class="checks"><label><input id="isAvailable" type="checkbox" checked> Disponible</label><label><input id="isSoldOut" type="checkbox"> Agotado</label><label><input id="isFeatured" type="checkbox"> Destacado</label></div><menu><button type="button" id="cancel">Cancelar</button><button id="save">Guardar</button></menu></form></dialog><script src="/admin/admin.js"></script></body></html>
