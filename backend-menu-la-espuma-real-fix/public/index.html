<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>La Espuma Burger · Carta</title>
  <link rel="preload" href="/assets/inicio_burger_fachada.webp" as="image" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <section id="inicio" class="home-hero" aria-label="Inicio La Espuma Burger">
      <div class="home-bg" aria-hidden="true"></div>
      <div class="home-vignette" aria-hidden="true"></div>
      <div class="home-content">
        <img class="home-logo" src="/assets/hero_logo_black_bg.png" alt="La Espuma Burger" />
        <p class="home-kicker">Carta digital</p>
        <h1>Smash, papas y picoteo con sabor de casa</h1>
        <p class="home-copy">Consulta la carta actualizada, fotos, alérgenos y disponibilidad en tiempo real.</p>
        <button id="goMenuBtn" class="home-menu-btn" type="button">Menú</button>
      </div>
    </section>

    <main id="menu" class="menu-page" aria-label="Carta La Espuma Burger">
      <header class="menu-sticky" id="menuSticky">
        <nav id="categoryBar" class="category-bar" aria-label="Categorías"></nav>
        <div class="view-row">
          <div class="view-dropdown" id="viewDropdown">
            <button id="viewToggle" class="view-toggle" type="button" aria-expanded="false" aria-haspopup="listbox">
              <span>Ver</span>
              <strong id="viewCurrent">Grande</strong>
              <span aria-hidden="true">▾</span>
            </button>
            <div id="viewMenu" class="view-menu" role="listbox" aria-label="Cambiar vista">
              <button type="button" data-view="grande" role="option">Grande</button>
              <button type="button" data-view="mosaico" role="option">Mosaico</button>
            </div>
          </div>
          <button id="aiQuickBtn" class="ai-inline-btn" type="button">Modo IA</button>
        </div>
      </header>

      <section id="menuStatus" class="menu-status">Cargando carta...</section>
      <section id="menuSections" class="menu-sections"></section>
    </main>

    <button id="aiFab" class="ai-fab" type="button" aria-label="Abrir Modo IA">
      <span></span> Modo IA
    </button>

    <aside id="aiPanel" class="ai-panel" aria-hidden="true" aria-label="Modo IA La Espuma Burger">
      <div class="ai-card">
        <header>
          <div>
            <p>La Espuma IA</p>
            <h2>Te recomiendo según lo que te apetece</h2>
          </div>
          <button id="aiClose" type="button" aria-label="Cerrar">×</button>
        </header>
        <div id="aiMessages" class="ai-messages"></div>
        <form id="aiForm" class="ai-form">
          <input id="aiInput" autocomplete="off" placeholder="Ej: algo con bacon, sin gluten, trufado..." />
          <button type="submit">Enviar</button>
        </form>
        <div class="ai-chips" aria-label="Consultas rápidas">
          <button type="button" data-prompt="Quiero una smash con bacon">Bacon</button>
          <button type="button" data-prompt="Recomiéndame algo trufado">Trufa</button>
          <button type="button" data-prompt="Quiero algo vegetariano">Vegetariano</button>
          <button type="button" data-prompt="Algo para niños">Niños</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
