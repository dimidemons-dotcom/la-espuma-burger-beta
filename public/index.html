<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>La Espuma Burger</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <img src="/assets/hero_logo_black_bg.png" alt="La Espuma Burger" class="splash-logo">
      <h1 class="splash-title">La Espuma Burger</h1>
      <p class="splash-subtitle">Gourmet Burgers & More</p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app" style="display: none;">
    <!-- Header -->
    <header class="header">
      <a href="#inicio" class="brand-mini">
        <img src="/assets/img_33c86f5dfeafca.png" alt="La Espuma Burger">
      </a>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="inicio">
      <div class="hero-content">
        <div class="hero-ux-cta">
          <a href="#menu" class="hero-btn hero-menu">≡ VER MENÚ</a>
          <button class="hero-btn hero-ai" id="heroModoIABtn">
            <span class="hero-ai-dot"></span>
            <span>MODO IA</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Menu Section -->
    <section class="menu-section" id="menu">
      <div class="menu-tabs" id="menuFilter" role="tablist">
        <button class="menu-tab active" data-category="picoteo" role="tab">Picoteo</button>
        <button class="menu-tab" data-category="papas" role="tab">Papas Locas</button>
        <button class="menu-tab" data-category="enrollados" role="tab">Enrollados</button>
        <button class="menu-tab" data-category="smash" role="tab">Burger</button>
        <button class="menu-tab" data-category="platos" role="tab">Pollo Brother</button>
        <button class="menu-tab" data-category="postres" role="tab">Postres</button>
        <button class="menu-tab" data-category="bebidas" role="tab">Bebidas</button>
      </div>

      <div class="menu-grid" id="menuGrid">
        <div class="menu-loading">Cargando carta...</div>
      </div>
    </section>

    <!-- AI Chat -->
    <div class="ai-chat" id="aiChat">
      <div class="ai-chat-header">
        <h3>Modo IA</h3>
        <button class="ai-chat-close" id="aiChatClose">×</button>
      </div>
      <div class="ai-chat-messages" id="aiChatMessages"></div>
      <div class="ai-chat-input">
        <input type="text" id="aiChatInput" placeholder="Pregúntame por platos...">
        <button id="aiChatSend">Enviar</button>
      </div>
    </div>

    <!-- Floating AI Button -->
    <button class="ai-floating-btn" id="aiFloatingBtn">
      <span class="ai-icon">🤖</span>
    </button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
